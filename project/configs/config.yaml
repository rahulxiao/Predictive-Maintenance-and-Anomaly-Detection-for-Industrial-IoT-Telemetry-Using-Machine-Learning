---
# NASA C-MAPSS Predictive Maintenance - Master Configuration

data:
  raw_dir: "../CMAPSSData"
  processed_dir: "data/processed"
  subsets: [1, 2, 3, 4]

preprocessing:
  rul_clip: 125
  near_constant_variance_threshold: 0.001
  window_length: 30
  window_stride: 1

models:
  random_seed: 42
  validation_fraction: 0.2

  random_forest:
    n_estimators: 200
    max_depth: 10
    min_samples_leaf: 5

  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8

  lstm:
    hidden_size: 128
    num_layers: 2
    dropout: 0.2
    batch_size: 256
    max_epochs: 60
    patience: 10
    learning_rate: 0.001

  cnn:
    channels: [32, 64]
    kernel_size: 3
    dropout: 0.2
    batch_size: 256
    max_epochs: 60
    patience: 10
    learning_rate: 0.001

evaluation:
  rul_clip: 125

anomaly:
  threshold_n: 30
  sensitivity_thresholds: [20, 30, 50]
  healthy_cycles_cutoff: 30

baselines:
  consecutive_cycles: 3
  sensor_vote_fraction: 0.3
  ewma_lambda: 0.2
  static_k_grid: [1.5, 2.0, 2.5, 3.0, 3.5, 4.0]
  ewma_l_grid: [1.5, 2.0, 2.5, 3.0, 3.5]

results:
  figures_dir: "results/figures"
  metrics_dir: "results"
  log_dir: "results"
